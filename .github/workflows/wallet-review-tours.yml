# Checks manuales que ejecuta el agente (R-14: P17.MAN, P18.MAN, P20.MAN y los de fases siguientes): corre un recorrido
# de revisión (test/browser/stack/review/) o un simulacro (test/browser/stack/drills/) de la app elegida contra el stack
# local y el fork, en los navegadores pedidos (instalados con sus dependencias en el runner), y sube las capturas como
# artefacto para el agente revisor independiente. Sólo a mano: no es un required check.
name: wallet-review-tours

on:
  # Un push que cambia la lista de pedidos corre los checks listados (y registra el workflow para despacharlo a mano).
  push:
    branches:
      - "feat/walletWeb/**"
    paths:
      - "wallet/manual-checks.json"
  workflow_dispatch:
    inputs:
      app:
        description: App
        required: true
        default: wallet
        type: choice
        options:
          - wallet
          - recovery
      tour:
        description: review/<recorrido> o drills/<simulacro> (spec de test/browser/stack/ sin .spec.ts)
        required: true
        default: review/onboarding
        type: string
      browsers:
        description: Navegadores separados por comas (chromium, firefox, webkit)
        required: true
        default: chromium,firefox
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ inputs.tour }}-${{ inputs.browsers }}
  cancel-in-progress: false

jobs:
  plan:
    name: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checks a correr
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          APP: ${{ inputs.app }}
          TOUR: ${{ inputs.tour }}
          BROWSERS: ${{ inputs.browsers }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            matrix="$(jq -cn --arg app "$APP" --arg tour "$TOUR" --arg browsers "$BROWSERS" '[{app: $app, tour: $tour, browsers: $browsers}]')"
          else
            matrix="$(jq -c '.reviewTours' wallet/manual-checks.json)"
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  review:
    name: review
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    environment: wallet-ci-frontend-${{ matrix.app }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain fijada
        uses: ./wallet/ci/actions/setup-toolchain
        with:
          tools: node pnpm foundry
          foundry-rpc-cache: "true"
      - name: Recorrido
        env:
          APP: ${{ matrix.app }}
          TOUR: ${{ matrix.tour }}
          MTW_BROWSERS: ${{ matrix.browsers }}
          MTW_REVIEW_DIR: ${{ runner.temp }}/review
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
          GOOGLE_DRIVE_TEST_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_TEST_CLIENT_ID }}
          GOOGLE_DRIVE_TEST_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_TEST_CLIENT_SECRET }}
          GOOGLE_DRIVE_TEST_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_TEST_REFRESH_TOKEN }}
          WALLETCONNECT_PROJECT_ID: ${{ secrets.WALLETCONNECT_PROJECT_ID }}
        run: bash wallet/ci/scripts/review-tour.sh
      - name: Capturas
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: review-${{ matrix.app }}-${{ strategy.job-index }}-${{ github.run_id }}
          path: ${{ runner.temp }}/review
          if-no-files-found: warn
          retention-days: 14
