# CI de la app Recovery (P02, P16, P19): design tokens, install congelado, lint, typecheck, tests (unit, build de release, grafo del bundle, Drive real), build, tests de navegador (headers y Trusted Types; desde P19, todos los flujos contra el stack real y el fork, conectores y el relay real de WalletConnect), SBOM y regla de dependencias comunes.
name: wallet-frontend-recovery

on:
  push:
    branches:
      - "feat/walletWeb/**"
      - main
    paths:
      - "wallet/frontend/recovery/**"
      - "wallet/frontend/design-tokens/**"
      - "wallet/contracts/test/vectors/**"
      - "wallet/config/**"
      - "wallet/ci/**"
      - "wallet/scripts/tools/**"
      - "wallet/backend/app/**"
      - "wallet/backend/signer/**"
      - "wallet/contracts/src/**"
      - "wallet/contracts/script/**"
      - "wallet/infra/local/postgres/**"
      - "wallet/docker-compose.yml"
      - "wallet/scripts/stack/**"
      - "wallet/scripts/lib/**"
      - "wallet/scripts/deploy-core"
      - "wallet/scripts/env.sh"
      - ".github/workflows/wallet-frontend-recovery.yml"
  pull_request:
    paths:
      - "wallet/frontend/recovery/**"
      - "wallet/frontend/design-tokens/**"
      - "wallet/contracts/test/vectors/**"
      - "wallet/config/**"
      - "wallet/ci/**"
      - "wallet/scripts/tools/**"
      - "wallet/backend/app/**"
      - "wallet/backend/signer/**"
      - "wallet/contracts/src/**"
      - "wallet/contracts/script/**"
      - "wallet/infra/local/postgres/**"
      - "wallet/docker-compose.yml"
      - "wallet/scripts/stack/**"
      - "wallet/scripts/lib/**"
      - "wallet/scripts/deploy-core"
      - "wallet/scripts/env.sh"
      - ".github/workflows/wallet-frontend-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-recovery:
    name: frontend-recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: wallet-ci-frontend-recovery
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Historia completa: la regla de dependencias criptográficas comunes ([F-SEC-09]) recorre los lockfiles.
          fetch-depth: 0
      - name: Toolchain fijada
        uses: ./wallet/ci/actions/setup-toolchain
        with:
          tools: node pnpm foundry
          foundry-rpc-cache: "true"
      - name: ci-frontend-recovery
        env:
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
          WALLETCONNECT_PROJECT_ID: ${{ secrets.WALLETCONNECT_PROJECT_ID }}
          GOOGLE_DRIVE_TEST_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_TEST_CLIENT_ID }}
          GOOGLE_DRIVE_TEST_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_TEST_CLIENT_SECRET }}
          GOOGLE_DRIVE_TEST_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_TEST_REFRESH_TOKEN }}
        run: bash wallet/ci/scripts/ci-frontend-recovery.sh
