# CI del backend (API, worker, watcher, indexer, gas tank) y del integrity monitor (P02): install congelado, lint, typecheck, tests, cobertura y build.
# Los tests contra servicios con cuota (Mailgun, Gmail API) corren si el cambio toca email/autenticación, en la corrida
# diaria programada y a pedido (ci-backend.sh, docs/CI.md).
name: wallet-backend

on:
  push:
    branches:
      - "feat/walletWeb/**"
      - main
    paths:
      - "wallet/backend/app/**"
      - "wallet/backend/integrity-monitor/**"
      - "wallet/backend/signer/**"
      - "wallet/contracts/src/**"
      - "wallet/contracts/script/**"
      - "wallet/contracts/test/vectors/**"
      - "wallet/contracts/out-abi/**"
      - "wallet/config/**"
      - "wallet/infra/local/postgres/**"
      - "wallet/ci/**"
      - "wallet/scripts/tools/**"
      - "wallet/scripts/deploy-core"
      - "wallet/scripts/env.sh"
      - "wallet/scripts/lib/**"
      - ".github/workflows/wallet-backend.yml"
  pull_request:
    paths:
      - "wallet/backend/app/**"
      - "wallet/backend/integrity-monitor/**"
      - "wallet/backend/signer/**"
      - "wallet/contracts/src/**"
      - "wallet/contracts/script/**"
      - "wallet/contracts/test/vectors/**"
      - "wallet/contracts/out-abi/**"
      - "wallet/config/**"
      - "wallet/infra/local/postgres/**"
      - "wallet/ci/**"
      - "wallet/scripts/tools/**"
      - "wallet/scripts/deploy-core"
      - "wallet/scripts/env.sh"
      - "wallet/scripts/lib/**"
      - ".github/workflows/wallet-backend.yml"
  workflow_dispatch:
  schedule:
    # Diario: entrega real de email (Mailgun sandbox + Gmail API) aunque no haya cambios.
    - cron: "17 6 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: wallet-ci-backend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Historia completa: ci-backend.sh compara contra la base para decidir los tests live.
          fetch-depth: 0
      - name: Toolchain fijada
        uses: ./wallet/ci/actions/setup-toolchain
        with:
          tools: node pnpm foundry
          foundry-rpc-cache: "true"
      - name: ci-backend
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
          EMAIL_PROVIDER_API_KEY: ${{ secrets.EMAIL_PROVIDER_API_KEY }}
          EMAIL_PROVIDER_DOMAIN: ${{ secrets.EMAIL_PROVIDER_DOMAIN }}
          EMAIL_PROVIDER_BASE_URL: ${{ secrets.EMAIL_PROVIDER_BASE_URL }}
          EMAIL_TEST_ADDRESS: ${{ secrets.EMAIL_TEST_ADDRESS }}
          EMAIL_TEST_GOOGLE_CLIENT_ID: ${{ secrets.EMAIL_TEST_GOOGLE_CLIENT_ID }}
          EMAIL_TEST_GOOGLE_CLIENT_SECRET: ${{ secrets.EMAIL_TEST_GOOGLE_CLIENT_SECRET }}
          EMAIL_TEST_GOOGLE_REFRESH_TOKEN: ${{ secrets.EMAIL_TEST_GOOGLE_REFRESH_TOKEN }}
          # Log de cada Anvil de los tests (endpoint del fork redactado, test/helpers/fork.ts).
          MTW_ANVIL_LOG_DIR: ${{ runner.temp }}/anvil-logs
        run: bash wallet/ci/scripts/ci-backend.sh
      - name: Logs de Anvil (si falló)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: anvil-logs
          path: ${{ runner.temp }}/anvil-logs
          if-no-files-found: ignore
          retention-days: 7

  integrity-monitor:
    name: integrity-monitor
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain fijada
        uses: ./wallet/ci/actions/setup-toolchain
        with:
          tools: node pnpm
      - name: ci-integrity-monitor
        run: bash wallet/ci/scripts/ci-integrity-monitor.sh
