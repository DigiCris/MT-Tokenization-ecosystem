# CI de contratos (P02): build con tamaños, tests unit/integración/fork/fuzz/invariants, cobertura con umbrales y Slither.
name: wallet-contracts

on:
  push:
    branches:
      - "feat/walletWeb/**"
      - main
    paths:
      - "wallet/contracts/**"
      - "wallet/config/chains/**"
      - "wallet/ci/**"
      - "wallet/scripts/tools/**"
      - ".github/workflows/wallet-contracts.yml"
  pull_request:
    paths:
      - "wallet/contracts/**"
      - "wallet/config/chains/**"
      - "wallet/ci/**"
      - "wallet/scripts/tools/**"
      - ".github/workflows/wallet-contracts.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: wallet-ci-contracts
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain fijada
        uses: ./wallet/ci/actions/setup-toolchain
        with:
          tools: node foundry slither
          foundry-rpc-cache: "true"
      - name: ci-contracts
        env:
          FORK_RPC_URL: ${{ secrets.BASE_RPC_URL }}
        run: bash wallet/ci/scripts/ci-contracts.sh
