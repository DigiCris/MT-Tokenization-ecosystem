# Build reproducible de los frontends (P02): cada app se compila dos veces en jobs distintos y se comparan los release manifests.
name: wallet-repro-build

on:
  push:
    branches:
      - "feat/walletWeb/**"
      - main
    paths:
      - "wallet/frontend/**"
      - "wallet/ci/**"
      - "wallet/scripts/tools/**"
      - ".github/workflows/wallet-repro-build.yml"
  pull_request:
    paths:
      - "wallet/frontend/**"
      - "wallet/ci/**"
      - "wallet/scripts/tools/**"
      - ".github/workflows/wallet-repro-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build-${{ matrix.run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      matrix:
        run: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain fijada
        uses: ./wallet/ci/actions/setup-toolchain
        with:
          tools: node pnpm
      - name: Build de release
        run: bash wallet/ci/scripts/ci-repro-build.sh --single "${{ runner.temp }}/manifests"
      - name: Subir manifests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-manifests-${{ matrix.run }}
          path: ${{ runner.temp }}/manifests
          if-no-files-found: ignore
          retention-days: 7

  compare:
    name: compare
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Descargar manifests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-manifests-*
          path: ${{ runner.temp }}/manifests
      - name: Comparar
        run: bash wallet/ci/scripts/ci-repro-build.sh --compare "${{ runner.temp }}/manifests/release-manifests-1" "${{ runner.temp }}/manifests/release-manifests-2"
