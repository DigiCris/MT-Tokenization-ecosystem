rules:
  # Reglas propias de los frontends (P16.SEC, [F-SEC]): segunda capa, independiente de ESLint, sobre el código de cada
  # app (src/). Los casos prohibidos de lint-fixtures/ se excluyen en ci/scripts/ci-security.sh.
  - id: mtw-fe-html-sinks
    languages: [typescript, javascript]
    severity: ERROR
    message: sinks de HTML prohibidos en origins criptográficos (Trusted Types, [F-SEC-02]); construí el DOM con React.
    paths:
      include: ['frontend/*/src/**']
    pattern-either:
      - pattern: $EL.insertAdjacentHTML(...)
      - pattern: document.write(...)
      - pattern: document.writeln(...)
      - pattern: $EL.setHTMLUnsafe(...)
      - pattern: $RANGE.createContextualFragment(...)
      - pattern: new DOMParser().parseFromString(...)
  - id: mtw-fe-web-storage
    languages: [typescript, javascript]
    severity: ERROR
    message: Web Storage sólo en src/storage/flags.ts y src/drive/oauth-state.ts (flags no sensibles y state de OAuth, [F-KEY-07]).
    paths:
      include: ['frontend/*/src/**']
      exclude: ['frontend/*/src/storage/flags.ts', 'frontend/*/src/drive/oauth-state.ts']
    pattern-either:
      - pattern: localStorage
      - pattern: sessionStorage
      - pattern: window.localStorage
      - pattern: window.sessionStorage
  - id: mtw-fe-worker-string-url
    languages: [typescript, javascript]
    severity: ERROR
    message: los workers se crean sólo con una TrustedScriptURL de la política mtw-default (trustedScriptURL()), nunca con una URL en texto.
    paths:
      include: ['frontend/*/src/**']
      # Único lugar donde se construye un Worker: createTrustedWorker() con la TrustedScriptURL de la allowlist.
      exclude: ['frontend/*/src/security/trusted-types.ts']
    pattern-either:
      - pattern: new Worker(...)
      - pattern: new SharedWorker(...)
      - pattern: navigator.serviceWorker.register(...)
  - id: mtw-fe-postmessage-wildcard
    languages: [typescript, javascript]
    severity: ERROR
    message: postMessage a otra ventana con origin '*' expone el mensaje a cualquier origin.
    paths:
      include: ['frontend/*/src/**']
    pattern: $W.postMessage($MSG, '*', ...)
  - id: mtw-fe-dynamic-script
    languages: [typescript, javascript]
    severity: ERROR
    message: no se insertan scripts en tiempo de ejecución (sin third-party JS, [F-SEC-05]).
    paths:
      include: ['frontend/*/src/**']
    pattern: document.createElement('script')
