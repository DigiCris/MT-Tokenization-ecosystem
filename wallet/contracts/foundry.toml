# Proyecto Foundry de los contratos del sistema (P03.T02). Dependencias con Soldeer (soldeer.lock con
# checksums; verificadas contra los tags oficiales con script/verify-deps.sh) en lugar de submódulos git,
# porque .gitmodules tendría que vivir en la raíz del repositorio (todo vive bajo wallet/).

[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["dependencies"]
solc_version = "0.8.37"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "none"
cbor_metadata = false
ignored_warnings_from = ["dependencies"]
fs_permissions = [
  { access = "read", path = "../config" },
  { access = "read-write", path = "./test/vectors" },
  { access = "read-write", path = "./deployments" },
  # VerifyDeployment compara el runtime on-chain con los artefactos y registra la metadata del compilador.
  { access = "read", path = "./out" },
]

[profile.default.fuzz]
runs = 256
seed = "0x6d7477"

[profile.default.invariant]
runs = 64
depth = 32
fail_on_revert = false

# CI: fuzz 10.000 runs e invariants con profundidad 50 (P03.T02).
[profile.ci.fuzz]
runs = 10000
seed = "0x6d7477"

[profile.ci.invariant]
runs = 256
depth = 50
fail_on_revert = false

# Sólo los fork tests (contra FORK_RPC_URL en el bloque de config/chains/base-mainnet.json).
[profile.fork]
match_path = "test/fork/*"

[profile.fork.fuzz]
runs = 1000

[soldeer]
remappings_generate = false
remappings_regenerate = false
remappings_location = "txt"
recursive_deps = false

[dependencies]
forge-std = "1.17.0"
"@openzeppelin-contracts" = "5.6.1"
"@uniswap-v3-core" = "1.0.1"
safe-smart-account = { version = "1.5.0", git = "https://github.com/safe-fndn/safe-smart-account.git", rev = "dc437e8fba8b4805d76bcbd1c668c9fd3d1e83be" }

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"
